<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover deixa a página ir até às bordas; as margens de
         segurança são tratadas no CSS, com env(safe-area-inset-*). Sem isto o
         iPhone deixa duas faixas vazias em cima e em baixo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>FourLife · Four4AI</title>
    <meta name="description" content="Painel comercial da FourLife — saúde ocupacional e SST." />

    <!-- A cor da barra de estado acompanha o fundo da página, para não haver um
         risco de outra cor no topo do ecrã. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F6F6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A1314" />

    <!-- A letra dos títulos começa a descarregar ao mesmo tempo que o CSS, em
         vez de esperar por ele: sem isto, os títulos aparecem primeiro na letra
         de sistema e saltam quando ela chega. -->
    <link rel="preload" href="/tipos/rubik.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
    <link rel="icon" href="/icone-192.png" sizes="192x192" type="image/png" />

    <!-- O iOS não lê os ícones do manifesto para o ecrã principal: usa este. -->
    <link rel="apple-touch-icon" href="/icone-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FourLife" />

    <!-- Sem isto o Safari transforma números em links de telefone e parte a
         tipografia das tabelas. -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="raiz"></div>
    <script>
      /* O painel antigo instalava-se como app e guardava-se a si próprio. Sem isto,
         o telemóvel continua a mostrar o que tem em cache e nunca chega ao servidor.
         Corre antes de tudo o resto, e só recarrega se havia mesmo algo para tirar. */
      (function () {
        if (!("serviceWorker" in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (registos) {
          if (!registos.length) return;
          Promise.all(registos.map(function (r) { return r.unregister(); }))
            .then(function () {
              return "caches" in window
                ? caches.keys().then(function (n) { return Promise.all(n.map(function (c) { return caches.delete(c); })); })
                : null;
            })
            .then(function () { window.location.reload(); });
        }).catch(function () {});
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
